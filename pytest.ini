[pytest]
# 测试文件发现规则：只收 tests/ 下 test_*.py 里的 test_* 函数
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -v 输出每条用例名；-ra 结尾汇总"非通过"的用例
# --strict-markers：写错的 marker 直接报错（防止 @pytest.mark.slow 打成 @pytest.mark.solw 后静默失效）
addopts = -v -ra --strict-markers

# 只认识本项目实际用到的 marker（用到再往这里加，配合 --strict-markers）
markers =
    integration: 需要数据库/Redis 或起真实服务的测试（默认不跑，用 -m integration 显式启用）

# asyncio 模式：STRICT 要求 async 测试必须显式标注 @pytest.mark.asyncio，
# 避免"写了 async def 但忘了标注、于是根本没执行"这种静默失效
asyncio_mode = strict

# 日志：跑测试时把 ERROR 以上打出来，方便看是代码报错还是断言失败
log_cli = false
log_level = WARNING
